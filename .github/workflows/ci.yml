name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      ANTHROPIC_API_KEY: ""          # tests use a fake Claude client and never call the API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=80
      - name: Benchmark (smoke run)
        if: matrix.python == '3.12'
        run: python scripts/benchmark.py --builds 2 --rounds 3 --cache-queries 500 --out bench-ci
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench-ci/

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sift-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and exercise the API
        run: |
          docker run -d --name sift -p 8000:8000 sift-search:ci
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS "http://localhost:8000/api/search?q=parse+json" | grep -q '"total"'
          curl -fsS "http://localhost:8000/api/suggest?q=js" | grep -q '"suggestions"'
          test "$(docker inspect -f '{{.Config.User}}' sift)" = "app"
      - if: always()
        run: docker logs sift || true
