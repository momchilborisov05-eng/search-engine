<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sift - Search</title>
  <meta name="description" content="A search engine built from scratch: crawler, inverted index, BM25, trie autocomplete, analytics.">
  <script src="/static/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="logo"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg></span>
        <span>Sift</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/" aria-current="page">Search</a>
        <a href="/analytics">Analytics</a>
      </nav>
      <div class="top-right">
        <span class="badge neutral" id="modeBadge" title="Answer mode"><span class="dot"></span><span id="modeText">extractive</span></span>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle colour theme">
          <svg class="theme-light-icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="theme-dark-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Search, <span class="grad">built from scratch</span></h1>
      <p>Inverted index, BM25 ranking, phrase queries and trie autocomplete over the Python standard library docs.</p>

      <form class="search-box" id="searchForm" role="search" autocomplete="off">
        <label class="sr-only" for="q">Search query</label>
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="q" name="q" type="search" maxlength="200" placeholder="Try: parse json file" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
          <kbd>/</kbd>
          <button class="btn ghost" id="aiBtn" type="button" aria-pressed="false" title="Show an AI answer above the results">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span>Answer</span>
          </button>
          <button class="btn primary" type="submit"><span>Search</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <ul class="suggest" id="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
      </form>

      <div class="examples" id="examples">
        <button class="chip" type="button" data-q="parse json file">parse json file</button>
        <button class="chip" type="button" data-q="&quot;regular expression&quot;"><code>"regular expression"</code></button>
        <button class="chip" type="button" data-q="thread lock">thread lock</button>
        <button class="chip" type="button" data-q="socket -ssl">socket <code>-ssl</code></button>
        <button class="chip" type="button" data-q="decimal rounding">decimal rounding</button>
        <button class="chip" type="button" data-q="temporary directory">temporary directory</button>
      </div>
      <div class="index-stats" id="indexStats"></div>
      <div class="error-banner" id="error" role="alert" hidden></div>
    </section>

    <section class="results-shell" id="resultsShell" hidden aria-live="polite">
      <div class="results-meta">
        <span id="resultsCount" class="num"></span>
        <span class="parsed" id="parsed"></span>
        <span class="grow"></span>
        <span class="badge neutral num" id="took"></span>
        <span class="badge" id="cacheBadge" hidden><span class="dot"></span>cache hit</span>
      </div>
      <article class="card answer-card" id="answer" hidden>
        <div class="answer-head">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
          <h2>Answer</h2>
          <span class="badge neutral" id="answerMode"></span>
          <span class="grow"></span>
        </div>
        <div id="answerBody"></div>
      </article>
      <div id="results"></div>
      <nav class="pager" id="pager" aria-label="Pagination"></nav>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
